<div class="login-page">
  <form [formGroup]="form" (ngSubmit)="submit()" class="card">
    <div class="brand">
      <img src="images/humana-logo.png" alt="Humana" class="brand-logo" width="220" height="72" />
      <h1>Humana Form</h1>
      <p class="hint">Sign in with your tenant account</p>
    </div>

    @if (error()) {
      <div class="error" role="alert">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" inputmode="email" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <label class="remember">
      <input type="checkbox" formControlName="rememberMe" />
      Remember me
    </label>

    <button type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
