<header class="page-header">
  <div class="header-row">
    <div>
      <h1>Change Password</h1>
      <p class="subtitle">Enter your current password and choose a new one</p>
    </div>
  </div>
</header>

@if (error()) {
  <div class="error">{{ error() }}</div>
}
@if (success()) {
  <div class="success">{{ success() }}</div>
}

<form class="account-form" [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Current password
    <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
      <span class="field-hint error-hint">Current password is required.</span>
    }
  </label>
  <label>
    New password
    <input type="password" formControlName="newPassword" autocomplete="new-password" />
    @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
      <span class="field-hint error-hint">New password must be at least 8 characters.</span>
    }
  </label>
  <label>
    Confirm new password
    <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    @if (form.controls.confirmPassword.touched && form.hasError('passwordMismatch')) {
      <span class="field-hint error-hint">Passwords do not match.</span>
    }
  </label>
  <div class="form-actions">
    <button type="submit" class="btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Change password' }}
    </button>
  </div>
</form>
